version: "3.9"

services:

  # -- Python AI Workflow API (FastAPI + LangGraph) ---------------------------
  ems-ai:
    build: .
    container_name: ems-ai-workflow
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # -- Python MCP Server ------------------------------------------------------
  ems-mcp:
    build: .
    container_name: ems-mcp-server
    command: python -m app.mcp_server.server
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # -- MySQL 8 (shared with EMS Spring Boot) ---------------------------------
  mysql:
    image: mysql:8.0
    container_name: ems-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evaluator_mapping_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/create_outlook_tables.sql:/docker-entrypoint-initdb.d/02_outlook_tables.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
